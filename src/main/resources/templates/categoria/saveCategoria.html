<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/formulario.css">
    <title>Document</title>
</head>

<body class="form-page">
    <div class="container form-shell">
        <div class="form-card">
            <div class="form-header">
                <h1>Guardar Categoria</h1>
                <p>Completa la informacion</p>
            </div>
            <form th:action="@{/categoria/guardado}" method="post" class="categoria-form" th:object="${categoria}">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input th:field="*{nombre}" type="text" id="nombre" name="nombre" placeholder="Ej. Accion" required>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripcion</label>
                    <textarea name="descripcion" id="descripcion" th:field="*{descripcion}" rows="10" cols="50"
                        placeholder="Describe la categoria" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="/" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
